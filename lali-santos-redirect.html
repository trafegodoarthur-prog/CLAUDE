<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lali Santos</title>

  <!-- Preconecta com Amazon imediatamente — reduz latência após redirect -->
  <link rel="preconnect" href="https://www.amazon.com.br" crossorigin />
  <link rel="dns-prefetch" href="https://www.amazon.com.br" />

  <!-- Pixel via Image — dispara instantâneo, não depende de JS e sobrevive ao redirect mobile -->
  <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1800011570554414&ev=ViewContent&noscript=1" />

  <!-- Meta Pixel SDK — carrega em paralelo para eventos enriquecidos -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','1800011570554414');
    fbq('track','PageView');
    fbq('track','ViewContent',{content_name:'Livro Lali Santos',content_category:'Livro',content_type:'product',currency:'BRL'});
  </script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}
    p{color:rgba(255,255,255,0.5);font-size:.9rem}
  </style>
</head>
<body>

  <p>Levando você para a Amazon…</p>

  <script>
    var AMAZON_URL = 'https://www.amazon.com.br/dp/B0GL3DRR56';
    setTimeout(function(){ window.location.replace(AMAZON_URL); }, 100);
  </script>

</body>
</html>
